name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test
      - name: CLI smoke test
        run: |
          export PRUDENT_HOME="$RUNNER_TEMP/prudent"
          node bin/prudent --version
          node bin/prudent demo
          node bin/prudent list
          node bin/prudent status demo-kestrel-retries --json > /dev/null || [ $? -eq 11 ]
