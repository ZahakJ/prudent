<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">prudent</title>
  <desc id="desc">prudent wordmark beside a small diff panel with a check mark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14161b"/>
      <stop offset="1" stop-color="#1b1f28"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cc79a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7cc79a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7cc79a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect x="96" y="262" width="520" height="1.5" fill="url(#glow)"/>

  <!-- wordmark -->
  <g transform="translate(96 92)">
    <rect x="0" y="6" width="64" height="64" rx="16" fill="none" stroke="#7cc79a" stroke-width="5"/>
    <path d="M17 40l11 11 20-26" fill="none" stroke="#7cc79a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="92" y="62" fill="#e6e8ee" font-family="Inter, 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="72" font-weight="650" letter-spacing="-1.5">prudent</text>
    <text x="2" y="132" fill="#9aa2b1" font-family="Inter, 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="25">A calm local review desk for the patches your AI agents write.</text>
  </g>

  <!-- diff panel -->
  <g transform="translate(860 58)" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace" font-size="15">
    <rect width="330" height="204" rx="14" fill="#1d2027" stroke="#2c313c"/>
    <rect width="330" height="36" rx="14" fill="#232731"/>
    <rect y="22" width="330" height="14" fill="#232731"/>
    <circle cx="20" cy="18" r="5" fill="#3a404d"/>
    <circle cx="38" cy="18" r="5" fill="#3a404d"/>
    <circle cx="56" cy="18" r="5" fill="#3a404d"/>
    <text x="80" y="23" fill="#858d9c" font-size="13">fetch.py</text>

    <rect x="12" y="48" width="306" height="22" rx="4" fill="#231f18" stroke="#3a3222"/>
    <rect x="12" y="48" width="3" height="22" fill="#8a7346"/>
    <text x="24" y="64" fill="#e2bd72" font-size="12.5" font-family="Inter, system-ui, sans-serif">why: retry busy servers, then give up</text>

    <text x="18" y="96" fill="#5d6576">12</text>
    <text x="52" y="96" fill="#aeb4c0">for attempt in range(n):</text>
    <rect x="0" y="104" width="330" height="24" fill="#e88a8a" fill-opacity="0.13"/>
    <text x="18" y="121" fill="#e88a8a">−</text>
    <text x="52" y="121" fill="#c9a0a0">raise</text>
    <rect x="0" y="130" width="330" height="24" fill="#7cc79a" fill-opacity="0.14"/>
    <text x="18" y="147" fill="#7cc79a">+</text>
    <text x="52" y="147" fill="#b8e6c8">sleep(2 ** attempt)</text>
    <rect x="0" y="156" width="330" height="24" fill="#7cc79a" fill-opacity="0.14"/>
    <text x="18" y="173" fill="#7cc79a">+</text>
    <text x="52" y="173" fill="#b8e6c8">continue</text>

    <g transform="translate(286 168)">
      <circle r="26" fill="#1b2c22" stroke="#7cc79a" stroke-width="3"/>
      <path d="M-11 1l7 7 15-16" fill="none" stroke="#7cc79a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
